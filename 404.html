<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>페이지를 찾을 수 없습니다 — 국회기록원 프로토타입</title>
<script>
/* 구술기록을 기록콘텐츠 아래(/contents/oral-history/)에서 국회기록물 아래(/records/oral-history/)로 옮김.
   예전 주소의 파일(영상·PDF 등)은 새 위치로 넘김 */
(function(){
  var p = location.pathname;
  if (p.indexOf("/contents/oral-history/") > -1)
    location.replace(p.replace("/contents/oral-history/", "/records/oral-history/") + location.search + location.hash);
})();
</script>
</head><body style="font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;padding:40px 20px">
<p>페이지를 찾을 수 없습니다.</p>
<p><a href="/naa-prototype/">국회기록원 프로토타입 첫 화면으로</a></p>
</body></html>
